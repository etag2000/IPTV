function msseg($id) {
    $baseDir = _DIR_ . '/dl/';
    $dirPath = $baseDir . $id;

    if (!file_exists($dirPath) && !mkdir($dirPath, 0777, true)) {
        die(json_encode(["error" => "Failed to create directory"]));
    }

    return $dirPath . '/';
}
